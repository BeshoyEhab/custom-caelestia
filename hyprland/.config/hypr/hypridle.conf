$lock_cmd = hyprctl dispatch 'hl.dsp.global("quickshell:lock")' & pidof qs quickshell hyprlock || hyprlock

general {
    lock_cmd = $lock_cmd
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.global("quickshell:lockFocus")'
}

# Idle timeouts (lock, screen-off, suspend) are managed by the Quickshell shell
# via Settings > Screen lock (GeneralIdle.timeouts). hypridle is only used to
# refocus the lock screen after waking from sleep.